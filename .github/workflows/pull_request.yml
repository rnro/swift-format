name: Pull request

# PRs created by GitHub Actions don't kick off further actions (https://github.com/peter-evans/create-pull-request/blob/d57e551ebc1a16dee0b8c9ea6d24dba7627a6e35/docs/concepts-guidelines.md#triggering-further-workflow-runs).
# As a workaround, we mark automerge PRs that are created by GitHub actions as draft and trigger the GitHub actions by marking the PR as ready for review. We'd prefer not re-triggering testing on a normal user's PR in this case, but skipping them causes the checks to reset.

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test
    uses: rnro/github-workflows/.github/workflows/package_test.yml@unification
    with:
      # A fork's default branch does not carry the change, so the ref is named.
      # A released version needs neither input.
      workflows_repository: rnro/github-workflows
      workflows_ref: unification
      # Two calls in one workflow share a concurrency group unless each names
      # itself, and would otherwise cancel each other.
      name: tests
      enable_cross_pr_testing: true
      # The old default list began at 5.9 and the excludes removed 5.9 and 5.10,
      # leaving 6.0 upward; the new defaults begin at 6.1. 6.0 is named so that
      # migrating does not quietly raise what this package is tested against —
      # the manifest's tools version is 6.0, and narrowing that is a decision for
      # this repository rather than a side effect of changing CI.
      linux_swift_versions: '["6.0", "6.1", "6.2", "6.3", "nightly-release", "nightly-main"]'
      windows_swift_versions: '["6.0", "6.1", "6.2", "6.3", "nightly-release", "nightly-main"]'
      # Swift 6.0 cannot build the ucrt module against the Windows SDK on the
      # runner image. A container carries one matched to its toolchain, so keeping
      # 6.0 in the matrix means keeping the container the old workflow used.
      windows_use_docker: true
  cmake-smoke-test:
    name: cmake-smoke-test
    uses: rnro/github-workflows/.github/workflows/package_test.yml@unification
    with:
      # A fork's default branch does not carry the change, so the ref is named.
      # A released version needs neither input.
      workflows_repository: rnro/github-workflows
      workflows_ref: unification
      name: cmake-smoke-test
      linux_setup_command: INSTALL_CMAKE=1 ./.github/scripts/prebuild.sh
      linux_command: './.github/scripts/cmake-smoke-test.sh -DCMAKE_C_COMPILER=`which clang` -DCMAKE_CXX_COMPILER=`which clang++` -DCMAKE_Swift_COMPILER=`which swiftc`'
      linux_swift_versions: '["nightly-main"]'
      enable_macos: true
      macos_swift_versions: '["6.3"]'
      macos_setup_command: INSTALL_CMAKE=1 ./.github/scripts/prebuild.sh
      macos_command: 'export PATH=$PATH:$RUNNER_TOOL_CACHE && ./.github/scripts/cmake-smoke-test.sh -DCMAKE_C_COMPILER=`which clang` -DCMAKE_CXX_COMPILER=`which clang++` -DCMAKE_Swift_COMPILER=`which swiftc`'
      windows_setup_command: 'Invoke-Program .\.github\scripts\prebuild.ps1 -InstallCMake'
      windows_swift_versions: '["nightly-main"]'
      windows_command: 'Invoke-Program .\.github\scripts\cmake-smoke-test.ps1 "-DCMAKE_C_COMPILER=$((Get-Command clang).Path)" "-DCMAKE_CXX_COMPILER=$((Get-Command clang).Path)" "-DCMAKE_Swift_COMPILER=$((Get-Command swiftc).Path)" "-DCMAKE_STATIC_LIBRARY_PREFIX_Swift=lib" "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL"'
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.14
    with:
      license_header_check_project_name: "Swift.org"
      api_breakage_check_allowlist_path: "api-breakages.txt"
  compatibility_check:
    # Format a list of real-world projects that enforce formatting using the latest swift-format version.
    name: Check compatibility with real world projects
    runs-on: ubuntu-latest
    container:
      image: swift:6.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Checkout the workflow scripts
        uses: actions/checkout@v6
        with:
          repository: swiftlang/github-workflows
          ref: 0.0.15
          path: github-workflows
          persist-credentials: false
      - name: Mark the workspace as safe
        # https://github.com/actions/checkout/issues/766
        run: git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: Check out related PRs
        run: |
          swift github-workflows/.github/workflows/scripts/cross-pr-checkout.swift "${{ github.repository }}" "${{ github.event.number }}"
      - name: Build
        run: |
          swift build --configuration release
      - name: Add local swift-format to PATH
        run: |
          # Add the locally built version of swift-format to PATH so it gets picked up by check-swift-format.sh
          echo "PATH=$(pwd)/.build/release:$PATH" >> "$GITHUB_ENV"
      - name: Make the check format script executable
        run: |
          chmod +x "$GITHUB_WORKSPACE/github-workflows/.github/workflows/scripts/check-swift-format.sh"
      - name: Format swift-format
        run: |
          cd "$GITHUB_WORKSPACE"
          "$GITHUB_WORKSPACE/github-workflows/.github/workflows/scripts/check-swift-format.sh"
      - name: Checkout swift-syntax
        uses: actions/checkout@v6
        with:
          repository: swiftlang/swift-syntax
          persist-credentials: false
          path: swift-syntax
      - name: Format swift-syntax
        run: |
          cd "$GITHUB_WORKSPACE/swift-syntax"
          "$GITHUB_WORKSPACE/github-workflows/.github/workflows/scripts/check-swift-format.sh"
      - name: Checkout sourcekit-lsp
        uses: actions/checkout@v6
        with:
          repository: swiftlang/sourcekit-lsp
          persist-credentials: false
          path: sourcekit-lsp
      - name: Format sourcekit-lsp
        run: |
          cd "$GITHUB_WORKSPACE/sourcekit-lsp"
          "$GITHUB_WORKSPACE/github-workflows/.github/workflows/scripts/check-swift-format.sh"
